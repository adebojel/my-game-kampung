<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Open World Cidadap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container Utama Game 3D -->
    <div id="game-container"></div>

    <!-- UI / Tombol Kontrol Mobile Modern -->
    <div id="ui-container">
        <!-- Minimap Bulat di Pojok Kiri Atas -->
        <div id="minimap">
            <span class="minimap-text">🗺️ Cidadap</span>
        </div>

        <!-- Tombol Pause di Pojok Kanan Atas -->
        <div id="btn-pause">⏸</div>

        <!-- Kontrol Kiri: Joystick Setang / Gerak -->
        <div id="controls-left">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>

        <!-- Panel Tombol Aksi di Kiri Bawah (Tambahan: Klakson/Lompat) -->
        <div id="actions-left">
            <button class="icon-btn" id="btn-jump">🏃</button>
            <button class="icon-btn" id="btn-vehicle">🏍️</button>
        </div>

        <!-- Panel Tombol Aksi & Gas/Rem di Kanan Bawah -->
        <div id="controls-right">
            <div class="action-row">
                <button class="icon-btn" id="btn-inventory">🎒</button>
                <button class="icon-btn" id="btn-camera">📷</button>
            </div>
            <div class="pedal-row">
                <button class="pedal-btn" id="btn-brake">Rem</button>
                <button class="pedal-btn" id="btn-gas">Gas</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
