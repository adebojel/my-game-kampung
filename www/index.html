<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Open World Cidadap - Final Master Edition</title>
  <link rel="stylesheet" href="style.css">
  <!-- Pustaka Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- GLTFLoader untuk Memuat File .glb (.gltf) Aset Anda -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <div id="ui-container">
    <div id="minimap-container" class="interactive-ui">
      <div id="minimap-pointer"></div>
    </div>
    <div id="hud-status" class="interactive-ui">
      <div id="player-cash">Rp 500.000</div>
      <div id="wanted-stars">⭐ 0</div>
      <div id="mission-text">Misi: Jelajahi Rute Cidadap - Cicurug</div>
    </div>
    <div id="controls-left" class="interactive-ui">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>
    <div id="controls-right" class="interactive-ui">
      <div class="control-btn" id="btn-action">Naik</div>
      <div class="control-btn" id="btn-jump">Loncat</div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
