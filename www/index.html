<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Game Kampung - GTA Mode</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Core Engines -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.0/nipplejs.min.js"></script>
</head>
<body>
    <!-- Permission & Orientation Blocker -->
    <div id="orientation-blocker">Putar HP Lu ke Mode Miring (Landscape)!</div>

    <!-- UI Game Utama -->
    <div id="game-ui">
        <!-- Minimap GTA (Bisa di-klik untuk Waypoint) -->
        <div id="minimap-container">
            <div id="minimap"></div>
            <div id="player-blip"></div>
            <div id="waypoint-blip"></div>
        </div>
        
        <!-- HUD Uang, Darah, Senjata -->
        <div class="hud-top-right">
            <div id="money">$00500000</div>
            <div class="health-bar"><div id="health-fill"></div></div>
            <div id="weapon-display">M4 (30/90)</div>
        </div>

        <div id="location-text">Cidadap</div>

        <!-- Area Rotasi Kamera 360 (Setengah Layar Kanan) -->
        <div id="camera-touch-zone"></div>

        <!-- Joystick Bergerak (Kiri) -->
        <div id="joystick-zone"></div>

        <!-- Tombol Aksi (Jalan Kaki) -->
        <div id="action-buttons-foot" class="control-group active">
            <button id="btn-shoot">Tembak</button>
            <button id="btn-jump">Lompat</button>
            <button id="btn-enter-vehicle" style="display:none;">Naik Kendaraan</button>
        </div>

        <!-- Tombol Aksi (Kendaraan) -->
        <div id="action-buttons-vehicle" class="control-group">
            <button id="btn-gas">Gas</button>
            <button id="btn-brake">Rem/Mundur</button>
            <button id="btn-exit-vehicle">Turun</button>
        </div>
    </div>

    <!-- Sistem Radio -->
    <audio id="game-radio" loop></audio>
    <script src="game.js"></script>
</body>
</html>
