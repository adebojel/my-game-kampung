<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Open World Cidadap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container Utama Game 3D -->
    <div id="game-container"></div>

    <!-- UI / Tombol Kontrol Mobile -->
    <div id="ui-container">
        <!-- Minimap di Pojok Kiri Atas -->
        <div id="minimap">
            <span>🗺️ Minimap Cidadap</span>
        </div>

        <!-- Tombol Kontrol di Kanan (Sudah Dirapikan) -->
        <div id="controls-right">
            <button id="btn-action" class="control-btn">Aksi</button>
            <div class="pedal-container">
                <button id="btn-brake" class="control-btn">Rem</button>
                <button id="btn-gas" class="control-btn">Gas</button>
            </div>
        </div>

        <!-- Joystick / Kontrol Arah di Kiri -->
        <div id="controls-left">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>
    </div>

    <!-- Memuat Library Three.js dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Skrip Inisialisasi Sentuh & Logika Dasar UI -->
    <script>
        const stick = document.getElementById('joystick-stick');
        const base = document.getElementById('joystick-base');
        
        let isTouching = false;
        let centerX, centerY;

        base.addEventListener('touchstart', (e) => {
            isTouching = true;
            const rect = base.getBoundingClientRect();
            centerX = rect.left + rect.width / 2;
            centerY = rect.top + rect.height / 2;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            const touch = e.touches[0];
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            
            const distance = Math.min(35, Math.sqrt(dx * dx + dy * dy));
            const angle = Math.atan2(dy, dx);
            
            let x = Math.cos(angle) * distance;
            let y = Math.sin(angle) * distance;
            
            stick.style.transform = `translate(${x}px, ${y}px)`;
        });

        window.addEventListener('touchend', () => {
            if (isTouching) {
                isTouching = false;
                stick.style.transform = `translate(0px, 0px)`;
            }
        });
    </script>

    <!-- Logika Game Utama -->
    <script src="game.js"></script>
</body>
</html>
