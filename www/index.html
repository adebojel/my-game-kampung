<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Kampung - Cidadap Open World</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI Top Bar */
        #ui-top {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 100;
        }
        .ui-box {
            background: rgba(0, 0, 0, 0.6); color: white; padding: 8px 12px;
            border-radius: 8px; font-size: 13px; font-weight: bold; pointer-events: auto;
        }
        #minimap { width: 90px; height: 90px; border: 2px solid white; background: #2e4a32; position: relative; overflow: hidden; }
        #minimap-player { width: 6px; height: 6px; background: #ffcc00; position: absolute; top: 42px; left: 42px; border-radius: 50%; }

        /* Notification Banner */
        #notification {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85); color: #ffeb3b; padding: 8px 16px;
            border-radius: 6px; font-size: 13px; font-weight: bold; display: none; text-align: center;
            border: 1px solid #ffeb3b; z-index: 200; pointer-events: none;
        }

        /* Controls UI */
        .control-btn {
            position: absolute; width: 75px; height: 75px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.25); border: 2px solid white; color: white;
            font-size: 13px; font-weight: bold; display: flex; align-items: center; justify-content: center;
            touch-action: manipulation; cursor: pointer; z-index: 100;
        }
        #btn-gas { bottom: 25px; right: 25px; background: rgba(0, 200, 0, 0.6); width: 85px; height: 85px; font-size: 18px; }
        #btn-rem { bottom: 25px; right: 125px; background: rgba(200, 0, 0, 0.6); width: 75px; height: 75px; }
        #btn-switch { top: 75px; left: 15px; width: auto; height: 35px; padding: 0 12px; border-radius: 6px; background: rgba(0, 120, 255, 0.7); font-size: 12px; z-index: 100; }
        #btn-camera { top: 75px; right: 15px; width: auto; height: 35px; padding: 0 12px; border-radius: 6px; background: rgba(120, 50, 200, 0.8); font-size: 12px; z-index: 100; }
        #btn-action { bottom: 45px; right: 215px; background: rgba(255, 150, 0, 0.8); display: none; z-index: 100; }
        #btn-backpack { top: 120px; left: 15px; width: auto; height: 32px; padding: 0 10px; border-radius: 6px; background: rgba(180, 40, 40, 0.8); font-size: 12px; z-index: 100; }

        /* Joystick */
        #joystick-base {
            position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; touch-action: none; z-index: 100;
        }
        #joystick-stick {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.7); border-radius: 50%; pointer-events: none;
        }

        /* Backpack Modal */
        #inventory-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 280px; background: rgba(20, 20, 20, 0.95); border: 2px solid #888;
            border-radius: 10px; padding: 15px; color: white; display: none; z-index: 300;
        }
        .inv-item { background: #333; margin: 6px 0; padding: 8px; border-radius: 5px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .inv-btn { background: #ff9800; border: none; padding: 4px 8px; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-top">
        <div id="minimap"><div id="minimap-player"></div></div>
        <div class="ui-box" id="status-info">⏰ 16:27 | ⚡ Stamina: 100% | 🐟 Ikan: 0</div>
    </div>

    <div id="notification">Pemberitahuan Sistem</div>

    <button class="control-btn" id="btn-switch">Ganti: Motor</button>
    <button class="control-btn" id="btn-camera">📷 Kamera: Standar</button>
    <button class="control-btn" id="btn-backpack">🎒 Ransel</button>
    <button class="control-btn" id="btn-action">Pancing</button>

    <div id="joystick-base"><div id="joystick-stick"></div></div>
    <button class="control-btn" id="btn-rem">Rem</button>
    <button class="control-btn" id="btn-gas">Gas</button>

    <div id="inventory-modal">
        <h3 style="margin-top:0; font-size:16px; border-bottom:1px solid #555; padding-bottom:5px;">Tas Ransel Survival</h3>
        <div class="inv-item"><span>🎒 Tas Besar (Kapasitas Luas)</span></div>
        <div class="inv-item"><span>🔪 Survival Knife</span></div>
        <div class="inv-item"><span>🔥 Kompor Portable & Korek</span></div>
        <div class="inv-item">
            <span id="fish-count-text">🐟 Ikan Tangkapan: 0</span>
            <button class="inv-btn" id="btn-cook">Masak</button>
        </div>
        <button id="close-inv" style="width:100%; margin-top:10px; background:#d32f2f; border:none; padding:8px; color:white; border-radius:5px; font-weight:bold;">Tutup</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- GAME KAMPUNG: FISIKA KENDARAAN LURUS KE DEPAN ALA GTA ---
        let scene, camera, renderer;
        let player, vehicleType = 0; // 0: Motor, 1: Angkot, 2: Pesawat
        let vehicles = [];
        let npcs = [];
        
        let stats = { time: "16:27", stamina: 100, fish: 0 };
        let joyMove = { x: 0, y: 0, active: false, pointerId: null };
        let isGas = false, isBrake = false;
        let speed = 0;
        let playerAngle = 0; // Sudut arah hadap kendaraan
        let planeAltitude = 15;

        // Kamera GTA (0: Dekat, 1: Standar, 2: Jauh)
        let cameraMode = 1; 
        let cameraAngleOffset = 0;

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            createGroundAndEnvironment();
            createPlayerVehicles();
            createNPCs();

            setupMultiTouchControls();
            window.addEventListener('resize', onWindowResize);
        }

        function createGroundAndEnvironment() {
            const groundGeo = new THREE.PlaneGeometry(500, 3000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e6f40, roughness: 0.95 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(0, 0, -1000);
            scene.add(ground);

            const roadSegments = [
                { x: 0, z: 0, length: 450, rotY: 0 },
                { x: -18, z: -425, length: 450, rotY: 0.12 },
                { x: -5, z: -850, length: 450, rotY: -0.08 },
                { x: 12, z: -1275, length: 450, rotY: 0.05 }
            ];

            roadSegments.forEach(pt => {
                const roadGroup = new THREE.Group();
                const roadGeo = new THREE.PlaneGeometry(14, pt.length);
                const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
                const road = new THREE.Mesh(roadGeo, roadMat);
                road.rotation.x = -Math.PI / 2;
                roadGroup.add(road);

                const lineGeo = new THREE.PlaneGeometry(0.4, pt.length);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.y = 0.02;
                roadGroup.add(line);

                roadGroup.position.set(pt.x, getElevation(pt.z) + 0.05, pt.z);
                roadGroup.rotation.y = pt.rotY;
                scene.add(roadGroup);

                for (let zLocal = -pt.length/2; zLocal < pt.length/2; zLocal += 40) {
                    createSundaneseHouse(pt.x - 16, pt.z + zLocal);
                    createSundaneseHouse(pt.x + 16, pt.z + zLocal - 12);
                    createTree(pt.x - 10, pt.z + zLocal - 6);
                    createTree(pt.x + 10, pt.z + zLocal - 18);
                }
            });

            const mountainGeo = new THREE.ConeGeometry(350, 160, 8);
            const mountainMat = new THREE.MeshStandardMaterial({ color: 0x1e3f28, roughness: 0.9 });
            const mountain = new THREE.Mesh(mountainGeo, mountainMat);
            mountain.position.set(-150, 80, -1600);
            scene.add(mountain);

            const lakeGeo = new THREE.PlaneGeometry(110, 110);
            const lakeMat = new THREE.MeshStandardMaterial({ color: 0x1e90ff, roughness: 0.2 });
            const lake = new THREE.Mesh(lakeGeo, lakeMat);
            lake.rotation.x = -Math.PI / 2;
            lake.position.set(-55, 0.08, -650);
            scene.add(lake);
        }

        function getElevation(z) {
            return Math.sin(z * 0.005) * 3.0;
        }

        function createSundaneseHouse(x, z) {
            const houseGroup = new THREE.Group();
            const baseGeo = new THREE.BoxGeometry(6, 4, 6);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 2;
            houseGroup.add(base);

            const roofGeo = new THREE.ConeGeometry(5, 3, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x5C4033 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = 5.5;
            roof.rotation.y = Math.PI / 4;
            houseGroup.add(roof);

            houseGroup.position.set(x, getElevation(z), z);
            scene.add(houseGroup);
        }

        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 3);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1.5;

            const leavesGeo = new THREE.ConeGeometry(2.5, 5, 5);
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 4.5;

            treeGroup.add(trunk);
            treeGroup.add(leaves);
            treeGroup.position.set(x, getElevation(z), z);
            scene.add(treeGroup);
        }

        function createNPCs() {
            const npcPositions = [
                { x: -5, z: -60 }, { x: 6, z: -200 }, 
                { x: -25, z: -500 }, { x: 15, z: -900 }
            ];

            npcPositions.forEach(pos => {
                const npcGroup = new THREE.Group();
                const bodyGeo = new THREE.CylinderGeometry(0.5, 0.3, 2);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff5722 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 1;
                npcGroup.add(body);

                const headGeo = new THREE.SphereGeometry(0.35, 8, 8);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 2.2;
                npcGroup.add(head);

                npcGroup.position.set(pos.x, getElevation(pos.z), pos.z);
                scene.add(npcGroup);
                npcs.push(npcGroup);
            });
        }

        function createPlayerVehicles() {
            const motorGroup = new THREE.Group();
            const mBody = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 2), new THREE.MeshStandardMaterial({ color: 0xd32f2f }));
            mBody.position.y = 0.5;
            motorGroup.add(mBody);
            scene.add(motorGroup);
            vehicles.push(motorGroup);

            const angkotGroup = new THREE.Group();
            const aBody = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 4.5), new THREE.MeshStandardMaterial({ color: 0x00a86b }));
            aBody.position.y = 1.1;
            angkotGroup.add(aBody);
            angkotGroup.visible = false;
            scene.add(angkotGroup);
            vehicles.push(angkotGroup);

            const planeGroup = new THREE.Group();
            const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 5), new THREE.MeshStandardMaterial({ color: 0xf5f5f5 }));
            const pWings = new THREE.Mesh(new THREE.BoxGeometry(7, 0.1, 1.5), new THREE.MeshStandardMaterial({ color: 0x333333 }));
            pBody.position.y = 1; pWings.position.y = 1;
            planeGroup.add(pBody); planeGroup.add(pWings);
            planeGroup.visible = false;
            scene.add(planeGroup);
            vehicles.push(planeGroup);

            player = vehicles[0];
        }

        function setupMultiTouchControls() {
            const stick = document.getElementById('joystick-stick');
            const base = document.getElementById('joystick-base');

            base.addEventListener('pointerdown', (e) => {
                joyMove.active = true;
                joyMove.pointerId = e.pointerId;
                updateJoystick(e);
            });

            window.addEventListener('pointermove', (e) => {
                if (joyMove.active && e.pointerId === joyMove.pointerId) {
                    updateJoystick(e);
                } else if (!joyMove.active && e.clientX > window.innerWidth * 0.3 && e.clientY < window.innerHeight * 0.7) {
                    if (e.buttons > 0 || e.pressure > 0) {
                        cameraAngleOffset -= e.movementX * 0.005;
                    }
                }
            });

            window.addEventListener('pointerup', (e) => {
                if (e.pointerId === joyMove.pointerId) {
                    joyMove.active = false;
                    joyMove.pointerId = null;
                    joyMove.x = 0; joyMove.y = 0;
                    stick.style.transform = `translate(0px, 0px)`;
                }
            });

            function updateJoystick(e) {
                const rect = base.getBoundingClientRect();
                let x = e.clientX - (rect.left + rect.width / 2);
                let y = e.clientY - (rect.top + rect.height / 2);
                const dist = Math.sqrt(x*x + y*y);
                const maxDist = 35;
                if (dist > maxDist) { x *= maxDist / dist; y *= maxDist / dist; }
                stick.style.transform = `translate(${x}px, ${y}px)`;
                joyMove.x = x / maxDist; joyMove.y = y / maxDist;
            }

            const btnGas = document.getElementById('btn-gas');
            const btnRem = document.getElementById('btn-rem');

            btnGas.addEventListener('pointerdown', (e) => { e.preventDefault(); isGas = true; });
            btnGas.addEventListener('pointerup', (e) => { e.preventDefault(); isGas = false; });
            btnGas.addEventListener('pointercancel', () => { isGas = false; });

            btnRem.addEventListener('pointerdown', (e) => { e.preventDefault(); isBrake = true; });
            btnRem.addEventListener('pointerup', (e) => { e.preventDefault(); isBrake = false; });
            btnRem.addEventListener('pointercancel', () => { isBrake = false; });

            const btnSwitch = document.getElementById('btn-switch');
            const vehicleNames = ["Motor", "Angkot", "Pesawat"];
            btnSwitch.addEventListener('click', () => {
                player.visible = false;
                vehicleType = (vehicleType + 1) % 3;
                player = vehicles[vehicleType];
                player.visible = true;
                btnSwitch.innerText = `Ganti: ${vehicleNames[vehicleType]}`;
                showNotification(`Berganti Kendaraan ke ${vehicleNames[vehicleType]}`);
            });

            const btnCamera = document.getElementById('btn-camera');
            const cameraNames = ["Dekat", "Standar", "Jauh"];
            btnCamera.addEventListener('click', () => {
                cameraMode = (cameraMode + 1) % 3;
                btnCamera.innerText = `📷 Kamera: ${cameraNames[cameraMode]}`;
                showNotification(`Sudah beralih ke Sudut Pandang Kamera ${cameraNames[cameraMode]}`);
            });

            document.getElementById('btn-backpack').addEventListener('click', () => {
                document.getElementById('inventory-modal').style.display = 'block';
            });
            document.getElementById('close-inv').addEventListener('click', () => {
                document.getElementById('inventory-modal').style.display = 'none';
            });

            const btnAction = document.getElementById('btn-action');
            btnAction.addEventListener('click', () => {
                stats.fish++;
                document.getElementById('fish-count-text').innerText = `🐟 Ikan Tangkapan: ${stats.fish}`;
                updateStatsUI();
                showNotification("Berhasil Menangkap 1 Ikan di Danau Gunung!");
            });

            document.getElementById('btn-cook').addEventListener('click', () => {
                if (stats.fish > 0) {
                    stats.fish--;
                    stats.stamina = Math.min(100, stats.stamina + 15);
                    document.getElementById('fish-count-text').innerText = `🐟 Ikan Tangkapan: ${stats.fish}`;
                    updateStatsUI();
                    showNotification("🍳 Memasak Ikan dengan Kompor Portable! Stamina Pulih (+15%)");
                } else {
                    showNotification("Ikan di ransel habis! Mancing dulu ke danau.");
                }
            });
        }

        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.innerText = text;
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 3000);
        }

        function updateStatsUI() {
            document.getElementById('status-info').innerText = `⏰ ${stats.time} | ⚡ Stamina: ${stats.stamina}% | 🐟 Ikan: ${stats.fish}`;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            let maxSpeed = vehicleType === 2 ? 0.75 : 0.48;
            if (isGas) {
                speed += 0.015;
                if (speed > maxSpeed) speed = maxSpeed;
            } else if (isBrake) {
                speed -= 0.035;
                if (speed < 0) speed = 0;
            } else {
                speed *= 0.93;
            }

            // Fisika Setir GTA: Kendaraan berbelok saat berjalan lurus ke depan
            if (Math.abs(joyMove.x) > 0.05 && speed > 0.005) {
                playerAngle -= joyMove.x * 0.03 * (speed / maxSpeed);
            }
            player.rotation.y = playerAngle;

            // Kendaraan meluncur lurus ke depan sesuai arah hadap bodinya (Anti-menyamping / anti-strafe)
            player.position.x += Math.sin(playerAngle) * speed;
            player.position.z -= Math.cos(playerAngle) * speed;

            if (vehicleType === 2) {
                planeAltitude -= joyMove.y * 0.25;
                planeAltitude = Math.max(5, Math.min(120, planeAltitude));
                player.position.y = planeAltitude;
            } else {
                player.position.y = getElevation(player.position.z) + 0.3;
            }

            let distZ = 9, distY = 4.5;
            if (cameraMode === 0) { distZ = 4.5; distY = 2.2; }       // Dekat
            else if (cameraMode === 1) { distZ = 9; distY = 4.5; }  // Standar
            else if (cameraMode === 2) { distZ = 16; distY = 8; }   // Jauh

            if (vehicleType === 2) { distZ += 8; distY += 4; }

            let totalAngle = playerAngle + cameraAngleOffset;
            camera.position.x = player.position.x - Math.sin(totalAngle) * distZ;
            camera.position.z = player.position.z + Math.cos(totalAngle) * distZ;
            camera.position.y = player.position.y + distY;
            camera.lookAt(player.position.x, player.position.y, player.position.z);

            const distToLake = Math.hypot(player.position.x - (-55), player.position.z - (-650));
            const btnAction = document.getElementById('btn-action');
            if (distToLake < 35) {
                btnAction.style.display = 'flex';
            } else {
                btnAction.style.display = 'none';
            }

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
