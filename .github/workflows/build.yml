name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android & Inject Custom Icon
        run: |
          npx cap init "Game Kampung" "com.adebojel.gamekampung" --web-dir www --force
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Compile APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug-unaligned.apk
